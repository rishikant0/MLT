<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <style>
      .mlt-navy { fill: #0D2853; }
      .mlt-green { fill: #22C55E; }
      .mlt-yellow { fill: #EAB308; stroke: #EAB308; }
      .mlt-text-navy { font-family: 'Inter', 'Outfit', system-ui, -apple-system, sans-serif; font-weight: 900; fill: #FFFFFF; }
      .mlt-text-green { font-family: 'Inter', 'Outfit', system-ui, -apple-system, sans-serif; font-weight: 700; fill: #22C55E; }
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- MAIN EMBLEM GROUP -->
  <g transform="translate(0, 0)">
    
    <!-- 1. HEXAGON SHIELD BASE -->
    <path d="M250 20 L420 118 L420 314 L250 412 L80 314 L80 118 Z" fill="#0D2853" rx="20" ry="20" stroke="#1E3A8A" stroke-width="4" />

    <!-- 2. PIXEL DIGITAL GRID (Top-Right of Hexagon) -->
    <rect x="330" y="55" width="22" height="22" rx="4" fill="#22C55E" />
    <rect x="356" y="55" width="22" height="22" rx="4" fill="#22C55E" />
    <rect x="382" y="55" width="22" height="22" rx="4" fill="#14B8A6" />
    <rect x="304" y="81" width="22" height="22" rx="4" fill="#0EA5E9" />
    <rect x="330" y="81" width="22" height="22" rx="4" fill="#14B8A6" />
    <rect x="356" y="81" width="22" height="22" rx="4" fill="#22C55E" />
    <rect x="382" y="81" width="22" height="22" rx="4" fill="#22C55E" />
    <rect x="278" y="107" width="22" height="22" rx="4" fill="#14B8A6" />
    <rect x="304" y="107" width="22" height="22" rx="4" fill="#0EA5E9" />
    <rect x="330" y="107" width="22" height="22" rx="4" fill="#22C55E" />

    <!-- 3. SCIENCE ATOM ORBIT (Above Open Book) -->
    <g transform="translate(180, 110)">
      <ellipse cx="0" cy="0" rx="38" ry="16" transform="rotate(-30)" stroke="#38BDF8" stroke-width="3.5" fill="none" />
      <ellipse cx="0" cy="0" rx="38" ry="16" transform="rotate(30)" stroke="#38BDF8" stroke-width="3.5" fill="none" />
      <ellipse cx="0" cy="0" rx="38" ry="16" transform="rotate(90)" stroke="#38BDF8" stroke-width="3.5" fill="none" />
      <circle cx="0" cy="0" r="7" fill="#EAB308" filter="url(#glow)" />
    </g>

    <!-- 4. OPEN MEDICAL BOOK -->
    <g transform="translate(110, 170)">
      <path d="M70 10 Q35 0 0 12 L0 82 Q35 70 70 82 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
      <path d="M70 10 Q105 0 140 12 L140 82 Q105 70 70 82 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
      <path d="M70 10 L70 82" stroke="#CBD5E1" stroke-width="3" />

      <circle cx="35" cy="46" r="10" stroke="#22C55E" stroke-width="2" fill="none" />
      <ellipse cx="35" cy="46" rx="14" ry="6" transform="rotate(45 35 46)" stroke="#22C55E" stroke-width="1.5" fill="none" />
      <ellipse cx="35" cy="46" rx="14" ry="6" transform="rotate(-45 35 46)" stroke="#22C55E" stroke-width="1.5" fill="none" />
      <circle cx="35" cy="46" r="2.5" fill="#22C55E" />

      <line x1="82" y1="28" x2="125" y2="28" stroke="#0D2853" stroke-width="3.5" stroke-linecap="round" />
      <line x1="82" y1="40" x2="125" y2="40" stroke="#0D2853" stroke-width="3.5" stroke-linecap="round" />
      <line x1="82" y1="52" x2="125" y2="52" stroke="#0D2853" stroke-width="3.5" stroke-linecap="round" />
      <line x1="82" y1="64" x2="112" y2="64" stroke="#0D2853" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- 5. MICROSCOPE -->
    <g transform="translate(260, 155)">
      <path d="M48 20 L22 56 L32 63 L58 27 Z" fill="#FFFFFF" />
      <circle cx="52" cy="14" r="9" fill="#22C55E" />
      <rect x="18" y="58" width="10" height="8" rx="2" fill="#0D2853" />
      <rect x="8" y="72" width="48" height="7" rx="2" fill="#FFFFFF" />
      <path d="M40 78 C40 98 55 98 55 110 L20 110 L20 118 L68 118 L68 110 C68 92 50 90 50 78 Z" fill="#FFFFFF" />
    </g>

    <!-- 6. TEST TUBE WITH LIQUID -->
    <g transform="translate(345, 175)">
      <rect x="0" y="0" width="24" height="75" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3" />
      <path d="M2 30 L22 30 L22 63 C22 70 16 73 12 73 C8 73 2 70 2 63 Z" fill="#22C55E" />
      <circle cx="12" cy="20" r="3" fill="#22C55E" />
      <circle cx="8" cy="12" r="2" fill="#22C55E" />
      <circle cx="16" cy="14" r="1.5" fill="#22C55E" />
    </g>

    <!-- 7. ECG PULSE WAVE -->
    <path d="M30 290 L180 290 L195 255 L215 330 L235 240 L255 290 L470 290" stroke="#EAB308" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="30" cy="290" r="8" fill="#22C55E" />
    <circle cx="470" cy="290" r="8" fill="#22C55E" />

  </g>

  <!-- BRAND TYPOGRAPHY BELOW EMBLEM -->
  <g transform="translate(0, 440)">
    <circle cx="35" cy="30" r="6" fill="#22C55E" />
    <line x1="41" y1="30" x2="140" y2="30" stroke="#22C55E" stroke-width="3" />

    <text x="250" y="44" text-anchor="middle" class="mlt-text-navy" font-size="64" letter-spacing="2">MLT</text>

    <line x1="360" y1="30" x2="459" y2="30" stroke="#22C55E" stroke-width="3" />
    <circle cx="465" cy="30" r="6" fill="#22C55E" />

    <text x="250" y="92" text-anchor="middle" class="mlt-text-green" font-size="40" letter-spacing="1">Learning Zone</text>
  </g>
</svg>
